<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>CEA LoL — Match Intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold-light:  #F0E6D3;
    --gold-mid:    #C8AA6E;
    --gold-dark:   #785A28;
    --gold-bright: #C89B3C;
    --blue-bright: #0BC4E3;
    --blue-mid:    #0397AB;
    --bg:          #010A13;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1920px; height:1080px; overflow:hidden;
    background:var(--bg); font-family:'Inter',sans-serif;
  }

  /* ── SPLIT BG ───────────────────────────────────────── */
  .split-bg { position:absolute; inset:0; display:flex; }
  .side-blue {
    flex:1;
    background:linear-gradient(150deg, #020d1c 0%, #081c32 50%, #0d2540 100%);
    clip-path:polygon(0 0, 100% 0, calc(100% - 150px) 100%, 0 100%);
  }
  .side-red {
    flex:1;
    background:linear-gradient(30deg, #090202 0%, #1a0707 50%, #230c0c 100%);
    clip-path:polygon(150px 0, 100% 0, 100% 100%, 0 100%);
  }
  .side-blue::after, .side-red::after {
    content:''; position:absolute; inset:0;
    background-image:repeating-linear-gradient(-50deg, transparent, transparent 50px, rgba(255,255,255,0.01) 50px, rgba(255,255,255,0.01) 51px);
  }
  /* Center glow burst */
  .center-burst {
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%) scale(0);
    width:360px; height:680px;
    background:radial-gradient(ellipse, rgba(200,155,60,0.07) 0%, transparent 70%);
    opacity:0;
    animation:burstIn 1s ease 0.5s forwards;
  }
  @keyframes burstIn {
    from { opacity:0; transform:translate(-50%,-50%) scale(0.2); }
    to   { opacity:1; transform:translate(-50%,-50%) scale(1); }
  }

  /* ── TOP BAR ────────────────────────────────────────── */
  .top-bar {
    position:absolute; top:0; left:0; right:0; height:58px;
    background:rgba(1,10,19,0.92); border-bottom:1px solid rgba(200,170,110,0.2);
    display:flex; align-items:center; justify-content:center; gap:22px;
    clip-path:inset(0 0 100% 0);
    animation:barDown 0.5s ease 0.1s forwards;
  }
  @keyframes barDown { to { clip-path:inset(0 0 0% 0); } }
  .match-tag {
    font-family:'Cinzel',serif; font-size:14px; font-weight:700;
    letter-spacing:0.3em; color:var(--gold-mid); text-transform:uppercase;
  }
  .sep { width:4px; height:4px; background:var(--gold-bright); transform:rotate(45deg); box-shadow:0 0 5px var(--gold-bright); }

  /* ── BOTTOM BAR ─────────────────────────────────────── */
  .bottom-bar {
    position:absolute; bottom:0; left:0; right:0; height:50px;
    background:rgba(1,10,19,0.92); border-top:1px solid rgba(200,170,110,0.15);
    display:flex; align-items:center; justify-content:center; gap:20px;
    clip-path:inset(100% 0 0 0);
    animation:barUp 0.5s ease 0.1s forwards;
  }
  @keyframes barUp { to { clip-path:inset(0% 0 0 0); } }
  .bottom-label {
    font-size:12px; font-weight:500; letter-spacing:0.22em;
    color:rgba(200,170,110,0.55); text-transform:uppercase;
  }

  /* ── CENTER DIVIDER LINE ─────────────────────────────── */
  .center-line {
    position:absolute; top:58px; bottom:50px; left:50%;
    width:1px;
    background:linear-gradient(180deg, transparent, rgba(120,90,40,0.35) 20%, rgba(120,90,40,0.35) 80%, transparent);
    transform:translateX(-0.5px);
  }

  /* ── TEAM PANELS ────────────────────────────────────── */
  .team-blue {
    position:absolute; left:0; top:58px; bottom:50px; width:850px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding-right:110px;
  }
  .team-red {
    position:absolute; right:0; top:58px; bottom:50px; width:850px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding-left:110px;
  }

  .side-label {
    font-size:11px; font-weight:700; letter-spacing:0.5em; text-transform:uppercase;
    margin-bottom:20px; opacity:0; animation:fadeIn 0.4s ease 0.4s forwards;
  }
  .team-blue .side-label { color:var(--blue-bright); }
  .team-red  .side-label { color:#E57373; }

  .team-name {
    font-family:'Cinzel',serif; font-size:78px; font-weight:900;
    text-align:center; line-height:1; letter-spacing:0.04em; text-transform:uppercase;
  }
  .team-blue .team-name {
    color:var(--gold-light);
    text-shadow:0 0 50px rgba(11,196,227,0.25);
    clip-path:inset(0 100% 0 0);
    animation:wipeLeft 0.85s cubic-bezier(0.77,0,0.18,1) 0.5s forwards;
  }
  .team-red .team-name {
    color:var(--gold-light);
    text-shadow:0 0 50px rgba(229,115,115,0.25);
    clip-path:inset(0 0 0 100%);
    animation:wipeRight 0.85s cubic-bezier(0.77,0,0.18,1) 0.5s forwards;
  }
  @keyframes wipeLeft  { to { clip-path:inset(0 0% 0 0); } }
  @keyframes wipeRight { to { clip-path:inset(0 0 0 0%); } }

  .team-stripe {
    width:180px; height:2px; margin:16px 0; border-radius:1px;
    opacity:0; animation:fadeIn 0.5s ease 1.1s forwards;
  }
  .team-blue .team-stripe {
    background:linear-gradient(90deg, transparent, var(--blue-bright), transparent);
    box-shadow:0 0 10px rgba(11,196,227,0.45);
  }
  .team-red .team-stripe {
    background:linear-gradient(90deg, transparent, #E57373, transparent);
    box-shadow:0 0 10px rgba(229,115,115,0.45);
  }

  .team-record {
    font-size:15px; font-weight:400; letter-spacing:0.18em;
    color:rgba(240,230,211,0.38); text-transform:uppercase;
    opacity:0; animation:fadeIn 0.5s ease 1.3s forwards;
  }

  /* ── VS BADGE ───────────────────────────────────────── */
  .center-block {
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center;
    z-index:10; opacity:0;
    animation:vsIn 0.7s cubic-bezier(0.34,1.56,0.64,1) 0.9s forwards;
  }
  @keyframes vsIn {
    from { opacity:0; transform:translate(-50%,-50%) scale(0.3); }
    to   { opacity:1; transform:translate(-50%,-50%) scale(1); }
  }

  .vs-badge {
    position:relative; width:108px; height:108px;
    display:flex; align-items:center; justify-content:center;
  }
  .ring {
    position:absolute; inset:0; border-radius:50%;
    border:1px solid rgba(200,170,110,0.35);
    animation:ringOut 2.8s ease-out 1.6s infinite;
  }
  .ring:nth-child(2) { animation-delay:2.2s; }
  .ring:nth-child(3) { animation-delay:2.7s; }
  @keyframes ringOut {
    0%   { transform:scale(1); opacity:0.5; }
    100% { transform:scale(2.4); opacity:0; }
  }
  .vs-hex { position:absolute; inset:0; }
  .vs-text {
    font-family:'Cinzel',serif; font-size:40px; font-weight:900;
    color:var(--gold-light); letter-spacing:0.06em; position:relative; z-index:1;
    text-shadow:0 0 20px rgba(200,155,60,0.9), 0 0 50px rgba(200,155,60,0.4);
  }

  .divider-h {
    display:flex; align-items:center; gap:10px;
    margin-top:14px; width:250px;
  }
  .div-line { flex:1; height:1px; background:linear-gradient(90deg, transparent, var(--gold-dark), transparent); }
  .div-dot  { width:5px; height:5px; background:var(--gold-bright); transform:rotate(45deg); }

  .match-number {
    font-size:12px; font-weight:600; letter-spacing:0.3em;
    color:var(--gold-dark); text-transform:uppercase; margin-top:10px;
  }

  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
</style>
</head>
<body>

<div class="split-bg">
  <div class="side-blue"></div>
  <div class="side-red"></div>
</div>
<div class="center-burst"></div>

<div class="top-bar">
  <span class="match-tag" id="topEvent">Spring Season 2025</span>
  <div class="sep"></div>
  <span class="match-tag" id="topRound">Quarterfinals</span>
  <div class="sep"></div>
  <span class="match-tag" id="topFormat">Best of 3</span>
</div>

<div class="center-line"></div>

<div class="team-blue">
  <div class="side-label">Blue Side</div>
  <div class="team-name" id="team1">Team Alpha</div>
  <div class="team-stripe"></div>
  <div class="team-record" id="record1">6W – 2L</div>
</div>

<div class="center-block">
  <div class="vs-badge">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <svg class="vs-hex" viewBox="0 0 108 108" fill="none">
      <polygon points="54,4 102,29 102,79 54,104 6,79 6,29" stroke="#C8AA6E" stroke-width="1.5" fill="rgba(1,10,19,0.88)"/>
      <polygon points="54,14 92,35 92,73 54,94 16,73 16,35" stroke="#785A28" stroke-width="0.8" fill="none" opacity="0.45"/>
    </svg>
    <div class="vs-text">VS</div>
  </div>
  <div class="divider-h">
    <div class="div-line"></div>
    <div class="div-dot"></div>
    <div class="div-line"></div>
  </div>
  <div class="match-number" id="matchNum">Match 1 of 3</div>
</div>

<div class="team-red">
  <div class="side-label">Red Side</div>
  <div class="team-name" id="team2">Team Bravo</div>
  <div class="team-stripe"></div>
  <div class="team-record" id="record2">5W – 3L</div>
</div>

<div class="bottom-bar">
  <span class="bottom-label">Corporate Esports Association</span>
  <div class="sep" style="background:rgba(200,170,110,0.3);box-shadow:none;"></div>
  <span class="bottom-label">League of Legends</span>
</div>

<script>
  const CONFIG = {
    team1:"Team Alpha", team2:"Team Bravo",
    record1:"6W – 2L", record2:"5W – 3L",
    event:"Spring Season 2025", round:"Quarterfinals",
    matchNum:"Match 1 of 3", format:"Best of 3",
  };
  const p = new URLSearchParams(location.search);
  ["team1","team2","record1","record2","event","round","matchNum","format"].forEach(k => {
    if (p.get(k)) CONFIG[k] = p.get(k);
  });
  document.getElementById("team1").textContent     = CONFIG.team1;
  document.getElementById("team2").textContent     = CONFIG.team2;
  document.getElementById("record1").textContent   = CONFIG.record1;
  document.getElementById("record2").textContent   = CONFIG.record2;
  document.getElementById("topEvent").textContent  = CONFIG.event;
  document.getElementById("topRound").textContent  = CONFIG.round;
  document.getElementById("topFormat").textContent = CONFIG.format;
  document.getElementById("matchNum").textContent  = CONFIG.matchNum;
</script>
</body>
</html>
